questions:
  - q: ¿Por qué bajar el RTO casi siempre sube el coste?
    kind: por-que
    uses: []
    a: El **RTO** es cuánto tardas en volver a funcionar. Para volver rápido necesitas tener **más infraestructura ya creada, replicada y encendida** en el sitio de recuperación. Restaurar desde backups es barato pero lento (horas); tenerlo todo corriendo en paralelo (multi-site) recupera en segundos pero pagas dos entornos.
  - q: "Compara pilot light y warm standby: ¿qué está encendido en cada uno?"
    kind: comparar
    uses: []
    a: "**Pilot light**: solo **lo crítico encendido**, normalmente la base de datos replicando; los servidores de aplicación están definidos (AMI, plantillas) pero apagados y se lanzan durante el desastre. **Warm standby**: una **copia completa pero reducida** de todo el entorno corriendo, lista para escalar y recibir tráfico. Más caro, menor RTO."
  - q: "Error común: ¿por qué tener backups no garantiza un RPO bajo?"
    kind: error-comun
    uses: []
    a: "El **RPO** es cuántos datos puedes perder: el tiempo desde la última copia válida. Con un backup diario puedes perder **hasta 24 horas** de datos. Un RPO de segundos o minutos exige **replicación continua** (réplicas, Aurora Global Database, recuperación a un momento dado), no backups periódicos."
  - q: Compara backup and restore y multi-site active/active.
    kind: comparar
    a: "Son los extremos. **Backup and restore**: solo copias en otra Región; el más barato y el más lento (RTO y RPO de horas). **Multi-site active/active**: el entorno completo funcionando en varias Regiones a la vez y recibiendo tráfico; RTO y RPO casi cero, coste máximo. Pilot light y warm standby están en medio."
    uses: []
  - q: "Quieres centralizar y automatizar los backups de EBS, RDS, DynamoDB y EFS con copias en otra Región: ¿qué usas?"
    kind: aplicar
    a: "**AWS Backup**: **planes de backup** con frecuencia y retención, aplicados a recursos por etiquetas, copias automáticas **entre Regiones y entre cuentas**, y **Vault Lock** para que nadie pueda borrar las copias antes de tiempo."
    uses: []
  - q: "Necesitas recuperar servidores on-premises en AWS en minutos si cae tu centro de datos: ¿qué servicio usas?"
    kind: aplicar
    a: "**AWS Elastic Disaster Recovery (DRS)**: replica de forma continua los discos de tus servidores a un área de staging barata en AWS. En un desastre lanza las instancias recuperadas en minutos (RTO de minutos, RPO de segundos), y luego permite volver al origen."
    uses: []
sims:
  - id: estrategia-dr
    title: Elige la estrategia de DR
    type: predecir-observar
    context: Tu negocio fija el RTO (cuánto puede estar caído). Mueve el RTO objetivo y predice cuál es la estrategia más barata que lo cumple.
    params:
      - id: rto_min
        label: RTO objetivo
        min: 0
        max: 600
        step: 5
        default: 240
        unit: min
    predict:
      question: ¿Cuál es la estrategia más barata que cumple ese RTO?
      options:
        - id: backup
          label: Backup & Restore
        - id: pilot
          label: Pilot Light
        - id: warm
          label: Warm Standby
        - id: multisite
          label: Multi-Site (activo-activo)
    outcomes:
      - when: rto_min >= 120
        answer: backup
        show: "Con horas de margen basta restaurar desde backups: la opción más barata."
      - when: rto_min >= 30
        answer: pilot
        show: "Decenas de minutos: el núcleo (base de datos replicada) ya está vivo y el resto se enciende."
      - when: rto_min >= 5
        answer: warm
        show: "Minutos: una versión reducida pero funcional ya corre y solo hay que escalarla."
      - when: "1"
        answer: multisite
        show: "RTO casi cero: hace falta un duplicado completo recibiendo tráfico."
    explain:
      prompt: Explica qué está encendido en la estrategia elegida y por qué cuesta lo que cuesta.
      rubric:
        - RTO es el tiempo máximo de caída aceptable
        - "Backup & Restore no tiene nada encendido: horas de recuperación"
        - Pilot Light mantiene vivo solo el núcleo, como la base de datos
        - Warm Standby tiene todo el sistema funcionando a escala reducida
        - Más infraestructura encendida significa menor RTO y mayor coste
