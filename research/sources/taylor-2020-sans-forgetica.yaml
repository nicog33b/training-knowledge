id: taylor-2020-sans-forgetica
title: "Disfluent difficulties are not desirable difficulties: the (lack of)
  effect of Sans Forgetica on memory"
authors:
  - Andrea Taylor
year: 2020
venue: Memory 28(7), 850–857
url: https://doi.org/10.1080/09658211.2020.1758726
kind: experiment
verified: secondary
retrieved: 2026-11-15
summary: Sans Forgetica se siente más difícil de leer pero no mejora la memoria;
  a veces la empeora.
facts:
  - "4 experimentos (882 participantes en total): Sans Forgetica se valoró más
    difícil de leer que Arial, pero la memoria fue igual o peor (menos pares de
    palabras recordados)."
caveats:
  - Leído en notas de prensa de Warwick y Futurity; autores fuera de Taylor no
    confirmados.
