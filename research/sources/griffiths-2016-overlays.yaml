id: griffiths-2016-overlays
title: "The effect of coloured overlays and lenses on reading: a systematic
  review of the literature"
authors:
  - Griffiths
  - Taylor
  - Henderson
  - Barrett
year: 2016
venue: Ophthalmic and Physiological Optics
url: https://www.pubmed.gov/27580753/
kind: systematic-review
verified: secondary
retrieved: 2026-11-26
summary: Las superposiciones o lentes de color no tienen evidencia sólida para
  mejorar la lectura en dislexia.
facts:
  - "51 publicaciones (54 conjuntos de datos) revisadas por riesgo de sesgo: la
    mayoría con riesgo alto o incierto; los estudios de menor riesgo apoyan
    menos el beneficio."
  - "Conclusión de los autores: la evidencia no respalda usar filtros de color
    para tratar dificultades de lectura."
caveats:
  - Evans y Allen (2016) hallaron que filtros prescritos individualmente pueden
    ayudar en el 'estrés visual', que no es dislexia.
  - Visto por resumen de búsqueda, no texto completo.
