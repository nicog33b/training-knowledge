summary: Dibujar uno mismo lo que se aprende ayuda, pero depende de cuánta guía
  tenga el dibujo.
facts:
  - Dibujar suele rendir más que resumir por escrito, pero los resultados varían
    según el nivel de guía del dibujo.
  - Otro meta-análisis sobre dibujo generativo y memoria reporta d = 0,65 frente
    a no dibujar (citado por fuentes secundarias).
caveats:
  - No se pudo leer el artículo; cifras del d = 0,65 provienen de otro
    meta-análisis visto por resumen.
  - URL del DOI deducida del patrón de Springer; confirmar (T-099).
