id: gentner-loewenstein-thompson-2003
title: "Learning and transfer: A general role for analogical encoding"
authors:
  - Dedre Gentner
  - Jeffrey Loewenstein
  - Leigh Thompson
year: 2003
venue: Journal of Educational Psychology 95(2)
url: https://dedregentner.owlstown.net/publications/38525
kind: experiment
verified: secondary
retrieved: 2026-11-15
summary: Comparar dos casos juntos (en vez de estudiarlos por separado) mejora
  mucho la transferencia del principio común a casos nuevos.
facts:
  - Comparar dos casos dio una ventaja marcada frente a estudiarlos por
    separado; más apoyo a la comparación aumentó la transferencia en una
    negociación real.
  - En un estudio previo (1999), quienes compararon dos casos fueron casi 3
    veces más propensos a usar la estrategia entrenada.
caveats:
  - Datos de resúmenes de terceros; volumen y páginas difieren entre fuentes.
