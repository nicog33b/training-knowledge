summary: Ranking de 10 técnicas de estudio por utilidad; base para priorizar
  práctica de recuperación y espaciada.
facts:
  - "Utilidad ALTA: práctica de recuperación (practice testing) y práctica
    distribuida."
  - "Utilidad MODERADA: interrogación elaborativa, autoexplicación, práctica
    intercalada."
  - "Utilidad BAJA: resumir, subrayar, mnemotecnia de palabra clave, imágenes
    para texto, releer."
  - Utilidad = cuánto funciona + cuánto generaliza (edades, capacidades, tareas,
    aula real).
caveats:
