id: pan-carpenter-2023
title: "Prequestioning and pretesting effects: a review of empirical research,
  theoretical perspectives, and implications for educational practice"
authors:
  - Pan
  - Carpenter
year: 2023
venue: Educational Psychology Review 35, art. 97
url: https://doi.org/10.1007/s10648-023-09814-5
kind: review
verified: secondary
retrieved: 2026-11-15
summary: Preguntar o evaluar ANTES de enseñar ayuda al aprendizaje posterior
  aunque se falle, si luego se ve la respuesta correcta.
facts:
  - El pretesting/prequestioning puede mejorar el aprendizaje incluso con muchas
    respuestas iniciales erróneas.
  - El beneficio requiere una oportunidad posterior de estudiar las respuestas
    correctas.
  - El tamaño del efecto varía según el procedimiento y cómo se mida el
    aprendizaje.
  - Los aprendices tienden a no ser conscientes del efecto (desconocimiento
    metacognitivo).
caveats:
  - El título completo y la atribución exacta a Pan & Carpenter se infirieron
    del DOI y de resúmenes; confirmar con el texto completo.
  - Un estudio de 2025 reporta que hasta ~30% de adultos online no mostró ni
    numéricamente el efecto en pares de palabras.
