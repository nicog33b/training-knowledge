id: koyunlu-unlu-2024-poe
title: "Effect of the Predict-Observe-Explain (POE) Strategy on Achievement in
  Science Education: A Meta-Analysis Study"
authors:
  - Zeynep Koyunlu Ünlü
year: 2024
venue: Yüzüncü Yıl Üniversitesi Eğitim Fakültesi Dergisi
url: https://dergipark.org.tr/tr/pub/yyuefd/article/1570041
kind: meta-analysis
verified: secondary
retrieved: 2026-11-15
summary: Predecir-observar-explicar tiene un efecto grande sobre el rendimiento
  en ciencias, con evidencia de calidad modesta.
facts:
  - "35 estudios: efecto medio g = 0.979 (IC 95 % 0.771-1.188) de POE sobre
    rendimiento en ciencias."
caveats:
  - Muchos estudios son tesis o no publicados; mide rendimiento, no cambio
    conceptual. El efecto real probablemente es menor.
  - Autoría y revista tomadas del resultado de búsqueda.
