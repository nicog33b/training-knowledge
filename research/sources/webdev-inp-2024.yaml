summary: Desde el 12-mar-2024 INP reemplaza a FID en Core Web Vitals; bueno ≤200
  ms en el percentil 75.
facts:
  - INP reemplazó a FID el 12-mar-2024. Bueno ≤ 200 ms, malo > 500 ms, medido en
    el percentil 75 de datos de campo.
  - FID solo medía la primera interacción; INP mide la latencia completa hasta
    el siguiente pintado en todas las interacciones.
