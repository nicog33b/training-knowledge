summary: 18 pautas de Microsoft para diseñar productos con IA, agrupadas en
  inicio, durante, cuando se equivoca y con el tiempo.
facts:
  - "18 pautas validadas con 49 profesionales de diseño sobre 20 productos con
    IA; agrupadas en 4 momentos: al inicio, durante la interacción, cuando la IA
    se equivoca y con el tiempo."
  - "Ejemplos: dejar claro qué puede hacer el sistema y qué tan bien (1–2),
    permitir corregir con facilidad cuando falla, pedir feedback granular (15),
    avisar de cambios (18)."
caveats:
  - Los autores advierten que no son una checklist simple. Lista completa no
    verificada.
