id: yan-bjork-bjork-2016
title: "On the difficulty of mending metacognitive illusions: A priori theories,
  fluency effects, and misattributions of the interleaving benefit"
authors:
  - Yan
  - Bjork
  - Bjork
year: 2016
venue: Journal of Experimental Psychology General
url: https://sites.lifesci.ucla.edu/psych-bjorklab/wp-content/uploads/sites/13/2016/11/YanBjorkBjork2016.pdf
kind: experiment
verified: secondary
retrieved: 2026-11-15
summary: Los alumnos creen que bloquear temas funciona mejor que intercalar
  aunque lo contrario sea cierto; la ilusión es difícil de corregir.
facts:
  - "Kornell & Bjork (2008): intercalar estilos de pintores mejoró la inducción
    de estilos, pero los participantes creían que bloquear había ayudado más."
  - ~80% pensó que bloquear era igual o mejor, incluso tras ver un test final
    favorable al intercalado (reportado por resumen).
  - Replicado con adultos mayores (Kornell, Castel, Eich & Bjork 2010).
  - Yan, Bjork & Bjork (2016) estudian por qué persiste la ilusión.
caveats:
  - Los datos de Kornell & Bjork 2008 provienen de un resumen de búsqueda, no
    del paper original (sin URL propia).
