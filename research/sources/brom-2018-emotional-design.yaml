id: brom-2018-emotional-design
title: How effective is emotional design? A meta-analysis on facial
  anthropomorphisms and pleasant colors during multimedia learning
authors:
  - Cyril Brom
  - Tereza Stárková
  - Sidney K. D'Mello
year: 2018
venue: Educational Research Review 25, 100–119
url: https://link.springer.com/article/10.1007/s10648-020-09545-x
kind: meta-analysis
verified: secondary
retrieved: 2026-11-15
summary: Colores agradables y formas amables en materiales multimedia pueden
  ayudar algo; en el estudio primario el color cálido solo no cambió las
  emociones.
facts:
  - "Plass et al. 2014 (estudio primario): formas redondeadas con aspecto de
    cara, solas o con color cálido, indujeron emociones positivas; los colores
    cálidos solos no afectaron las emociones."
caveats:
  - URL = la réplica-ampliación de 2020 que lo cita (no se encontró enlace
    verificado al original de 2018).
  - No se leyeron los tamaños de efecto del meta-análisis; existe una
    réplica-ampliación posterior (Educational Psychology Review 2020) no leída.
  - Usar solo como apoyo débil a una estética agradable, no como mecanismo de
    aprendizaje.
