id: costa-2022-4cid
title: "Four-component instructional design (4C/ID) model: a meta-analysis on
  use and effect"
authors:
  - Costa
  - Miranda
  - Melo
year: 2022
venue: Learning Environments Research
url: https://link.springer.com/10.1007/s10984-021-09373-y
kind: meta-analysis
verified: secondary
retrieved: 2026-11-15
summary: Diseñar con tareas completas (4C/ID) tiene efecto grande en adquisición
  de conocimiento, más en educación superior.
facts:
  - 12 estudios; efecto en adquisición de conocimiento d = 0.79 (IC 0.50-1.08),
    heterogeneidad alta.
  - "El nivel educativo moderó el efecto: más fuerte en educación superior."
  - "Revisión sistemática 2025 (Frontiers in Education): g = 0.76 pre-post en
    programas, pero muchos estudios describen mal la implementación."
caveats:
  - Pocos estudios (12) y alta heterogeneidad.
