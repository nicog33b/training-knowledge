id: kirschner-sweller-clark-2006
title: Why minimal guidance during instruction does not work
authors:
  - Paul A. Kirschner
  - John Sweller
  - Richard E. Clark
year: 2006
venue: Educational Psychologist 41(2), 75-86
url: https://www.davidlewisphd.com/courses/EDD8121/readings/2006-Kirschner_et_al.pdf
kind: review
verified: abstract
retrieved: 2026-11-15
summary: La enseñanza con guía mínima es menos eficaz para novatos e
  intermedios; la ventaja de guiar solo se reduce cuando el alumno ya sabe
  bastante.
facts:
  - Los estudios controlados disponibles apoyan casi uniformemente la guía
    directa y fuerte para alumnos novatos e intermedios.
  - La ventaja de la guía empieza a desaparecer solo cuando el alumno tiene
    conocimiento previo suficiente para guiarse a sí mismo.
caveats:
  - Es una revisión argumentativa, no un metaanálisis; tuvo réplicas en la misma
    revista (Hmelo-Silver et al. 2007; Schmidt et al. 2007).
