id: pashler-2008
title: "Learning Styles: Concepts and Evidence"
authors:
  - Pashler
  - McDaniel
  - Rohrer
  - Bjork
year: 2008
venue: Psychological Science in the Public Interest
url: https://scholarcommons.usf.edu/psy_facpub/1765
kind: review
verified: abstract
retrieved: 2026-11-15
summary: No hay evidencia sólida de que adaptar la instrucción al 'estilo' del
  alumno (visual/auditivo...) mejore resultados.
facts:
  - Un diseño válido exige asignación aleatoria a instrucción acorde o no al
    estilo y una prueba común.
  - Casi ningún estudio cumplía el diseño; los pocos que sí contradecían la
    hipótesis del 'meshing'.
caveats:
  - Revisión de 2008; ver clinton-lisell-2024 para evidencia más reciente.
