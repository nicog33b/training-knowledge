verified: abstract
retrieved: 2026-11-15
summary: "Tabla oficial de precios de OpenAI: gpt-6-luna cuesta lo mismo que
  Claude Haiku 5.5 y gpt-6.1-sol lo mismo que Claude Sonnet 5.5."
facts:
  - "gpt-6-luna: $0.10 entrada, $0.01 entrada cacheada, $0.50 salida por millón
    de tokens (contexto ≤272K)."
  - "gpt-6.1-sol: $2.00 / $0.10 cacheada / $10.00; gpt-6-astra (tope de gama):
    $10 / $1 / $50."
  - gpt-5-nano $0.05/$0.40 y gpt-5-mini $0.25/$2.00 siguen disponibles como
    opciones más baratas o antiguas.
caveats:
  - Leída mediante un resumen automático de la página oficial, no tabla copiada
    a mano.
  - "gpt-5.6-sol tiene precio promocional hasta el 2026-11-30: no se usa como
    equivalencia estable."
