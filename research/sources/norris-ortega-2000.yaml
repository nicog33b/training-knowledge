id: norris-ortega-2000
title: "Effectiveness of L2 instruction: A research synthesis and quantitative
  meta-analysis"
authors:
  - John M. Norris
  - Lourdes Ortega
year: 2000
venue: Language Learning 50(3), 417–528
url: https://doi.org/10.1111/0023-8333.00136
kind: meta-analysis
verified: secondary
retrieved: 2026-11-23
summary: Meta-análisis de 49 muestras (1980–1998) sobre instrucción en segunda
  lengua; la instrucción explícita superó a la implícita.
facts:
  - En estudios experimentales y cuasiexperimentales de instrucción L2
    publicados entre 1980 y 1998 (49 muestras), los tratamientos explícitos (d ≈
    1.13, 69 tratamientos) superaron a los implícitos (d ≈ 0.54, 29
    tratamientos), y los efectos se mantuvieron en pruebas diferidas.
caveats:
  - Cifras de d tomadas de fuentes secundarias (búsqueda), no del artículo;
    verificar en el original.
  - Solo ~16 % de las medidas eran de respuesta libre; los instrumentos
    favorecían el conocimiento explícito (los propios autores limitan la
    generalización). Shin (2010) critica la calidad de los datos primarios y la
    codificación.
  - La URL DOI no se pudo abrir desde el entorno (red bloqueada); el DOI se
    recordó, no se confirmó en vivo.
