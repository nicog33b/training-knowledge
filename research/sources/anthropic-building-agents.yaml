summary: Distingue workflows (caminos fijos en código) de agentes (el modelo
  decide) y recomienda empezar por lo simple.
facts:
  - "Workflows: LLM y herramientas orquestados por caminos predefinidos en
    código; agentes: el LLM dirige su propio proceso y uso de herramientas."
  - Recomienda empezar con llamadas directas a la API y la solución más simple;
    añadir complejidad (agentes) solo si mejora resultados medibles.
  - "Patrones de workflow descritos: encadenar prompts, enrutar, paralelizar,
    orquestador-trabajadores y evaluador-optimizador."
caveats:
