summary: Métricas de evaluación de RAG sin respuestas de referencia (fidelidad,
  relevancia de respuesta y de contexto).
facts:
  - Propone métricas sin referencia humana para evaluar las dimensiones de un
    pipeline RAG (recuperación y generación por separado).
caveats:
  - Definiciones exactas de las métricas no verificadas; las métricas basadas en
    LLM heredan sus sesgos (ver hardy-2026-autoscoring).
