id: spada-tomita-2010
title: "Interactions Between Type of Instruction and Type of Language Feature: A
  Meta-Analysis"
authors:
  - Nina Spada
  - Yasuyo Tomita
year: 2010
venue: Language Learning 60(2), 263–308
url: https://doi.org/10.1111/j.1467-9922.2010.00562.x
kind: meta-analysis
verified: secondary
retrieved: 2026-11-23
summary: Meta-análisis de 41 estudios sobre si la instrucción explícita o
  implícita funciona distinto con rasgos gramaticales simples y complejos.
facts:
  - Sobre 41 estudios, comparó instrucción explícita e implícita con rasgos
    gramaticales clasificados como simples o complejos según el número de
    criterios necesarios para producir la forma correcta (Hulstijn y de Graaff,
    1994), y midió tanto conocimiento controlado como uso espontáneo.
caveats:
  - No se leyeron los tamaños de efecto ni las conclusiones del texto; solo
    metadatos y descripción en resultados de búsqueda. Pendiente leer el
    original antes de citar su hallazgo principal.
  - URL DOI tomada de los resultados de búsqueda; no se pudo abrir desde el
    entorno.
