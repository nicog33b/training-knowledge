kind: meta-analysis
verified: secondary
retrieved: 2026-11-15
summary: Estudiar para enseñar y enseñar mejora el aprendizaje, más si la
  enseñanza es interactiva.
facts:
  - 28 estudios; g = 0.35 preparar-para-enseñar y g = 0.56 enseñar tras preparar.
  - Mayor beneficio cuando se espera y se hace enseñanza interactiva que no
    interactiva.
