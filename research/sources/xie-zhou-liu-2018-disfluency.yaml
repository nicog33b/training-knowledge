id: xie-zhou-liu-2018-disfluency
title: "The disfluency effect on learning: a meta-analysis"
authors:
  - Heping Xie
  - Zongkui Zhou
  - Qinxue Liu
year: 2018
venue: Educational Psychology Review (doi 10.1007/s10648-018-9442-x)
url: https://doi.org/10.1007/s10648-018-9442-x
kind: meta-analysis
verified: secondary
retrieved: 2026-11-15
summary: Las fuentes difíciles de leer (disfluencia perceptiva) no mejoran el
  aprendizaje.
facts:
  - "25 artículos, 3.135 participantes: efecto de la disfluencia perceptiva
    sobre recuerdo d = −0,01 y sobre transferencia d = 0,03 (nulos)."
caveats:
  - Un reanálisis (weissgerber-brunmair-rummer-2021) halló errores de
    codificación que restan credibilidad al resultado de recuerdo; el de
    transferencia se mantuvo.
