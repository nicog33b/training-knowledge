id: wcag-22-contrast-spacing
title: WCAG 2.2 Understanding — 1.4.3 Contrast (Minimum) y 1.4.12 Text Spacing
authors:
  - W3C
year: 2023
venue: W3C Web Accessibility Initiative
url: https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
kind: docs
verified: secondary
retrieved: 2026-11-15
summary: Contraste mínimo 4,5:1 (texto grande 3:1; nivel AAA 7:1) y el diseño no
  debe romperse si el usuario sube el espaciado.
facts:
  - "1.4.3 (AA): contraste ≥ 4,5:1 para texto normal y ≥ 3:1 para texto grande
    (≥18 pt o 14 pt en negrita); 1.4.6 (AAA): 7:1 y 4,5:1."
  - "1.4.12 (AA): el contenido no debe perderse si el usuario fija interlineado
    1,5×, espacio entre párrafos 2×, entre letras 0,12em y entre palabras
    0,16em."
caveats:
  - Datos de páginas de resumen y del borrador en GitHub de W3C; no se leyó la
    página normativa completa.
  - El 3:1 viene de normas ISO-9241-3 y ANSI-HFES-100-1988 según la propia W3C.
